name: Titanic API — CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/titanic-api

jobs:

  # ══════════════════════════════════════════
  # JOB 1 — TEST
  # ══════════════════════════════════════════
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install flask pandas numpy scikit-learn joblib pytest

      - name: Test imports
        run: |
          python -c "
          import flask, pandas, numpy, sklearn, joblib
          print('All imports OK')
          "

      - name: Test app syntax
        run: |
          python -c "
          import ast
          with open('app.py') as f:
              source = f.read()
          ast.parse(source)
          print('app.py syntax OK')
          "

  # ══════════════════════════════════════════
  # JOB 2 — BUILD & PUSH
  # ══════════════════════════════════════════
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login docker.io -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/titanic-api:latest -t ${{ secrets.DOCKER_USERNAME }}/titanic-api:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/titanic-api:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/titanic-api:${{ github.sha }}

      - name: Print image details
        run: |
          echo "Pushed: ${{ secrets.DOCKER_USERNAME }}/titanic-api:latest"
          echo "Pushed: ${{ secrets.DOCKER_USERNAME }}/titanic-api:${{ github.sha }}"

  # ══════════════════════════════════════════
  # JOB 3 — DEPLOY TO AZURE
  # ══════════════════════════════════════════
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: .

      - name: Health check
        run: |
          echo "Waiting 30s for app to start..."
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://titanic-ml-api-harsh-b8grcwe5hcdnh9ce.centralindia-01.azurewebsites.net/health)
          echo "Health check HTTP status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Deployment successful!"
          else
            echo "Warning: got HTTP $STATUS"
          fi

      - name: Deployment summary
        run: |
          echo "========================================="
          echo " DEPLOYMENT COMPLETE"
          echo " URL: https://titanic-ml-api-harsh-b8grcwe5hcdnh9ce.centralindia-01.azurewebsites.net"
          echo " Image: ${{ secrets.DOCKER_USERNAME }}/titanic-api:latest"
          echo " Commit: ${{ github.sha }}"
          echo "========================================="
