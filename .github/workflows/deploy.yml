name: Titanic API — CI/CD Pipeline

# ── Trigger: runs on every push to main branch ───────────────
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# ── Environment variables ─────────────────────────────────────
env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/titanic-api

jobs:

  # ════════════════════════════════════════════════════════════
  # JOB 1 — TEST
  # Runs on every push and pull request
  # ════════════════════════════════════════════════════════════
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install flask pandas numpy scikit-learn joblib pytest

      - name: Run basic import test
        run: |
          python -c "
          import flask, pandas, numpy, sklearn, joblib
          print('All imports OK')
          "

      - name: Test app starts correctly
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, '.')
          # Just verify app.py is importable without model
          import ast
          with open('app.py') as f:
              source = f.read()
          ast.parse(source)
          print('app.py syntax OK')
          "

  # ════════════════════════════════════════════════════════════
  # JOB 2 — BUILD & PUSH DOCKER IMAGE
  # Only runs on push to main (not on pull requests)
  # ════════════════════════════════════════════════════════════
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test                         # only runs if test passes
    if: github.ref == 'refs/heads/main' # only on main branch

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image details
        run: |
          echo "Image pushed: ${{ env.DOCKER_IMAGE }}:latest"
          echo "Image pushed: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}"

  # ════════════════════════════════════════════════════════════
  # JOB 3 — DEPLOY TO AZURE APP SERVICE
  # Only runs after successful build and push
  # ════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build-and-push             # only runs if build passes
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy zip to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: .

      - name: Verify deployment
        run: |
          echo "Waiting 30s for app to start..."
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.AZURE_WEBAPP_NAME }}-b8grcwe5hcdnh9ce.centralindia-01.azurewebsites.net/health)
          echo "Health check status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Deployment successful! App is healthy."
          else
            echo "Warning: Health check returned $STATUS"
          fi

      - name: Print deployment summary
        run: |
          echo "================================================"
          echo " DEPLOYMENT COMPLETE"
          echo "================================================"
          echo " App URL: https://${{ secrets.AZURE_WEBAPP_NAME }}-b8grcwe5hcdnh9ce.centralindia-01.azurewebsites.net"
          echo " Docker Image: ${{ env.DOCKER_IMAGE }}:latest"
          echo " Commit: ${{ github.sha }}"
          echo "================================================"