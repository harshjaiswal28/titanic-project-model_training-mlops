name: Titanic API CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install flask pandas numpy scikit-learn joblib

      - run: python -c "import flask, pandas, numpy, sklearn, joblib; print('OK')"

      - run: python -c "import ast; ast.parse(open('app.py').read()); print('Syntax OK')"

  build-and-push:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/titanic-api:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/titanic-api:latest

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: .

      - name: Health check
        run: |
          sleep 30
          curl -f https://titanic-ml-api-harsh-b8grcwe5hcdnh9ce.centralindia-01.azurewebsites.net/health && echo "HEALTHY" || echo "CHECK MANUALLY"

      - name: Deployment summary
        run: |
          echo "DEPLOYMENT COMPLETE"
          echo "URL: https://titanic-ml-api-harsh-b8grcwe5hcdnh9ce.centralindia-01.azurewebsites.net"